<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baucockpit – Von der Parzelle zum Haus</title>
  <!-- Seitenhülle rekonstruiert (Original-index.html fehlte im Quellordner); IDs nach app.js/plan.js -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 28h24M7 28V15l9-7 9 7v13"/><path d="M13 28v-7h6v7"/></svg>
        <span>Baucockpit <small>Parzelle bis Haus</small></span>
      </div>
      <div class="proj">
        <button class="btn sm ghost" id="btn-projects" type="button">Projekte</button>
        <span class="name" id="proj-name">–</span>
      </div>
      <div class="save-state" id="save-state"><i></i><span>gespeichert</span></div>
    </header>
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
  <dialog id="dlg">
    <form method="dialog">
      <div class="dh" id="dlg-h"></div>
      <div class="db" id="dlg-b"></div>
      <div class="df" id="dlg-f"></div>
    </form>
  </dialog>
  <div id="toast"></div>

  <script src="lib/leaflet.js"></script>
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="lib/PointerLockControls.js"></script>
  <script src="lib/GLTFExporter.js"></script>
  <script src="lib/ColladaExporter.js"></script>
  <script src="lib/OBJExporter.js"></script>
  <script src="lib/clipper.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script src="bauview-bruecke.js"></script>
</body>
</html>
